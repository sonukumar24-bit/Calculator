<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Calculator | JavaScript</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; background: #101826; color: #eef4ff; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 540px; }
    .badge { color: #89b8ff; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    h1 { font-size: clamp(30px, 7vw, 40px); margin: 12px 0 8px; letter-spacing: -1.5px; }
    .intro { color: #a9b6ca; line-height: 1.6; margin-bottom: 28px; }
    form { padding: 28px; background: #192438; border: 1px solid #304059; border-radius: 20px; box-shadow: 0 24px 60px #0003; }
    .numbers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; font-size: 13px; color: #c8d5e8; margin-bottom: 8px; }
    input, select, button { font: inherit; }
    input, select { width: 100%; min-width: 0; padding: 13px; border: 1px solid #40516b; border-radius: 9px; background: #101b2c; color: #fff; }
    input:focus, select:focus, button:focus-visible { outline: 3px solid #8ab9ff; outline-offset: 3px; }
    .operation { margin: 22px 0; }
    .actions { display: flex; gap: 12px; }
    button { padding: 13px 18px; border-radius: 9px; font-weight: 650; cursor: pointer; }
    button[type=submit] { flex: 1; border: 0; background: #82b3ff; color: #10213c; }
    button[type=submit]:hover { background: #a2c7ff; }
    button[type=reset] { border: 1px solid #40516b; background: transparent; color: #c8d5e8; }
    .answer { margin-top: 24px; padding: 22px; border: 1px solid #334b6b; border-radius: 12px; background: #112139; }
    #expression { color: #a9b6ca; font-size: 13px; margin: 0 0 10px; overflow-wrap: anywhere; }
    output { display: block; color: #a7ceff; font-size: 36px; font-weight: 700; overflow-wrap: anywhere; }
    output.error { color: #ffb4b4; font-size: 18px; line-height: 1.5; }
    footer { color: #91a1b9; text-align: center; font-size: 12px; line-height: 1.8; margin-top: 22px; }
    @media (max-width: 420px) { form { padding: 20px; } .numbers { grid-template-columns: 1fr; } }
  </style>
  <script defer src="addition.js"></script>
  <script defer src="subtraction.js"></script>
  <script defer src="multiplication.js"></script>
  <script defer src="division.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <span class="badge">JAVASCRIPT / LAB 02</span>
    <h1>Team Calculator</h1>
    <p class="intro">Four operations. One team. Enter your numbers and calculate.</p>
    <form id="calculator" novalidate>
      <div class="numbers">
        <div><label for="first">First number</label><input id="first" type="number" step="any" placeholder="e.g. 10" inputmode="decimal"></div>
        <div><label for="second">Second number</label><input id="second" type="number" step="any" placeholder="e.g. 20" inputmode="decimal"></div>
      </div>
      <div class="operation">
        <label for="operation">Operation</label>
        <select id="operation">
          <option value="add">+ Addition</option>
          <option value="subtract">- Subtraction</option>
          <option value="multiply">× Multiplication</option>
          <option value="divide">÷ Division</option>
        </select>
      </div>
      <div class="actions"><button type="submit">Calculate</button><button type="reset">Clear</button></div>
      <div class="answer" role="status" aria-live="polite" aria-atomic="true">
        <p id="expression">Your result will appear here</p>
        <output id="result" for="first second operation">0</output>
      </div>
    </form>
    <footer>Built with HTML, CSS &amp; JavaScript<br>Separate operator files · GitHub collaboration · VS Code</footer>
  </main>
</body>
</html>
